<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f8">
  <meta name="description" content="Bản đồ nhiệt độ bề mặt (LST), độ xanh thực vật (NDVI) và độ khô (TVDI) của 167 xã/phường TP.HCM sau sáp nhập (không gồm Côn Đảo), mùa khô 2020–2025, từ ảnh Landsat 8/9.">
  <title>Bản đồ Nhiệt - Xanh - Khô TP.HCM</title>
  <link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="styles/base.css?v=v3">
  <link rel="stylesheet" href="styles/app.css?v=v3">
  <link rel="stylesheet" href="styles/views.css?v=v3">
  <link rel="stylesheet" href="styles/charts.css?v=v3">
</head>
<body class="is-booting">
<div id="splash" role="status" aria-live="polite">
  <div class="splash-card">
    <svg class="splash-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#23756a"/><rect x="13" y="30" width="10" height="21" rx="3" fill="#ff8a5c"/><rect x="27" y="18" width="10" height="33" rx="3" fill="#7fd99a"/><rect x="41" y="25" width="10" height="26" rx="3" fill="#f6cf5a"/></svg>
    <div><strong>Bản đồ Nhiệt - Xanh - Khô</strong><small>TP.HCM · mùa khô 2020–2025</small></div>
    <div class="splash-bar"><i id="splashBar"></i></div>
    <p id="splashStatus">Đang khởi động…</p>
  </div>
</div>
<a class="skip" href="#map">Bỏ qua điều hướng</a>

<div id="app">
  <div id="map" role="region" aria-label="Bản đồ 167 xã/phường"></div>

  <header id="topbar">
    <a class="brand" href="#/" aria-label="Bản đồ Nhiệt - Xanh - Khô TP.HCM · về bản đồ">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#23756a"/><rect x="13" y="30" width="10" height="21" rx="3" fill="#ff8a5c"/><rect x="27" y="18" width="10" height="33" rx="3" fill="#7fd99a"/><rect x="41" y="25" width="10" height="26" rx="3" fill="#f6cf5a"/></svg>
      <span class="brand-name"><strong><span class="bd">Bản đồ </span>Nhiệt - Xanh - Khô</strong><small>TP.HCM · 167 xã/phường · Landsat 8/9</small></span>
    </a>
    <div id="indexSwitch" class="index-switch" role="group" aria-label="Chọn chỉ số"></div>
    <nav id="menu" class="menu" aria-label="Điều hướng"></nav>
  </header>

  <aside id="panel" class="panel" aria-label="Xếp hạng và lọc theo ngưỡng"></aside>
  <div id="mapTools" class="map-tools"></div>
  <div id="legend" class="legend" aria-live="polite"></div>
  <section id="info" class="info" aria-live="polite" aria-label="Khu vực đang chọn"></section>
  <div id="timeline" class="timeline" aria-label="Thời gian"></div>
</div>

<div id="pages" class="pages" hidden></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:90px 20px">Trang này cần JavaScript để hiển thị bản đồ.</p></noscript>
<script src="viewer-policy.js"></script>
<script type="module" src="js/app.js?v=v3"></script>
</body>
</html>
