# Build APK Android (arm64) trên GitHub và đăng lên Releases.
# Chạy tự động khi mã trong mobile/ đổi, hoặc bấm "Run workflow" trong tab Actions.
name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Chấp nhận giấy phép Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npx expo prebuild --platform android
      - name: Build bản release (chip arm64)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../MobileGIS_HCMC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MobileGIS_HCMC
          path: MobileGIS_HCMC.apk
      - name: Đăng lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          TAG="apk-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$TAG" MobileGIS_HCMC.apk --title "MobileGIS TP.HCM (bản build $TAG)" --notes "APK arm64 build tự động từ commit ${GITHUB_SHA::7}. Cài đè lên bản cũ được." --latest=false
